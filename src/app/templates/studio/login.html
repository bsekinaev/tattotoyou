<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Вход — ТАТТУТУЮ</title>
  <link rel="stylesheet" href="{{ request.url_for('studio-static', path='studio.css') }}">
</head>
<body class="login-body">
  <main class="login-card">
    <div class="brand brand-login">
      <span class="brand-mark">Т</span>
      <span><strong>ТАТТУТУЮ</strong><small>панель мастера</small></span>
    </div>
    <h1>Вход для Сони</h1>
    <p class="muted">Используй приватный ключ администратора. Сессия действует 12 часов.</p>
    {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
    <form method="post" action="/studio/login" class="stack-form">
      <input type="hidden" name="next_path" value="{{ next_path }}">
      <label>
        Ключ доступа
        <input name="admin_key" type="password" autocomplete="current-password" required autofocus>
      </label>
      <button class="primary-button" type="submit">Открыть панель</button>
    </form>
  </main>
</body>
</html>
